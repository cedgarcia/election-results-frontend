name: Build and Deploy

on:
  push:
    branches: [master] # Adjust branch name as needed
  pull_request:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm' # This replaces your node_modules cache

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          npm install

      - name: Clean previous builds
        run: |
          echo "Cleaning previous builds..."
          npm run clean

      - name: Build application
        run: |
          echo "Building application..."
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Adjust to your region

      - name: Deploy to S3
        run: |
          echo "Uploading files to S3 (contents of out/ only)..."
          aws s3 sync out/. s3://staging-map-visualizer --delete
          echo "Deployment done!"

      - name: Upload build artifacts (optional)
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: out/
          retention-days: 30
